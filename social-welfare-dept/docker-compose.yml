# GovConnect - Optional Isolated Docker Deployment
# NOTE: The primary development setup uses local PostgreSQL on port 5432.
# Use this docker-compose file ONLY if you wish to run an isolated containerized environment.

version: '3.8'

services:
  # Isolated PostgreSQL Database (Optional)
  social-welfare-db:
    image: postgres:16-alpine
    container_name: govconnect-social-welfare-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: govconnect_social_welfare
    ports:
      - "5434:5432" # Mapped to 5434 to avoid colliding with local Postgres (5432) or Revenue (5433)
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - social_welfare_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d govconnect_social_welfare"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Social Welfare Department API Service
  social-welfare-api:
    build: .
    container_name: govconnect-social-welfare-api
    ports:
      - "4002:4002"
    environment:
      PORT: 4002
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@social-welfare-db:5432/govconnect_social_welfare
      CORS_ORIGIN: "*"
    depends_on:
      social-welfare-db:
        condition: service_healthy
    volumes:
      - ./keys:/app/keys

volumes:
  social_welfare_pgdata:
